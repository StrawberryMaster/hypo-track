<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HypoTrack</title>
  <meta name="description" content="Plot your very own cyclone track maps">
  <meta name="author" content="Monsoonjr99, StrawberryMaster">
  <meta name="theme-color" content="#00b6d5">

  <meta property="og:type" content="website">
  <meta property="og:title" content="HypoTrack">
  <meta property="og:description" content="Plot your very own cyclone track maps">
  <meta property="og:image" content="https://strawberrymaster.github.io/hypo-track/resources/favicon.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HypoTrack">
  <meta name="twitter:description" content="Plot your very own cyclone track maps">
  <meta name="twitter:image" content="https://strawberrymaster.github.io/hypo-track/resources/favicon.png">

  <link rel="icon" type="image/png" href="./resources/favicon.png">
  <link type="text/css" rel="stylesheet" href="css/style.css" />

  <script src="js/dexie.min.js"></script>
  
  <script src="js/models.js"></script>
  <script src="js/state.js"></script>
  <script src="js/spatial.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/history.js"></script>
  <script src="js/import-export.js"></script>
  <script src="js/conegen.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/events.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "HypoTrack",
    "url": "https://strawberrymaster.github.io/hypo-track/",
    "description": "Plot your very own cyclone track maps",
    "applicationCategory": "UtilityApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5 Canvas.",
    "image": "https://strawberrymaster.github.io/hypo-track/resources/favicon.png",
    "screenshot": "https://strawberrymaster.github.io/hypo-track/resources/favicon.png",
    "author": [
      {
        "@type": "Person",
        "name": "Monsoonjr99",
        "url": "https://github.com/Monsoonjr99"
      },
      {
        "@type": "Person",
        "name": "StrawberryMaster",
        "url": "https://github.com/StrawberryMaster"
      }
    ],
    "featureList": [
      "Interactive canvas-based track map rendering with zoom controls",
      "Spatial coordinate tracking",
      "Cone of uncertainty generation",
      "Local database storage for storm history",
      "Track data import and export",
      "Multiple color themes"
    ]
  }
  </script>
</head>

<body>
  <main id="app-shell">
  <div id="canvas-container" role="application" aria-label="HypoTrack interactive map">
    <div id="coordinates-tab" class="hidden">
      <div class="coord-label">Coordinates</div>
      <div id="coord-lat" class="coord-value">--</div>
      <div id="coord-lon" class="coord-value">--</div>
    </div>

    <div id="zoom-controls">
      <button type="button" id="zoom-out-btn" aria-label="Zoom out">−</button>
      <label class="sr-only" for="zoom-slider">Map zoom</label>
      <input type="range" id="zoom-slider" min="0" max="15" step="0.25" value="0" aria-valuetext="Default zoom">
      <button type="button" id="zoom-in-btn" aria-label="Zoom in">+</button>
    </div>
  </div>
  <aside id="ui-container" aria-label="HypoTrack controls">
    <div id="theme-selector-container">
      <label id="theme-select-label" for="theme-select">Theme selector</label>
      <select id="theme-select" aria-labelledby="theme-select-label">
        <option value="vaporwave">Vaporwave</option>
        <option value="github">GitHub</option>
        <option value="monsoon">Monsoon</option>
        <option value="tropicana">Tropicana</option>
        <option value="violet">Violet</option>
        <option value="aurora">Aurora</option>
        <option value="cobalt">Cobalt</option>
        <option value="norville">Norville</option>
      </select>
    </div>
  </aside>
  </main>

  <a id="version"></a>
  <script src="js/version.js" defer></script>
  <script src="js/theme.js"></script>
</body>

</html>
